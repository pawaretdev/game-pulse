name: Rust API probe

on:
  push:
    paths: ['rust/**', '.github/workflows/rust-probe.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # Hosted CI proves build/tests only; it cannot validate rooc.exe or capture.
