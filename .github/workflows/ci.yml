name: CI

on:
  push:
    paths: ['src/**', 'tests/**', 'assets/**', 'build.rs', 'Cargo.*', '.cargo/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'assets/**', 'build.rs', 'Cargo.*', '.cargo/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # Hosted CI proves build/tests only; it cannot validate game detection or capture.
